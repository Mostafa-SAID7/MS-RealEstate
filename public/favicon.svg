<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="propertyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#propertyGrad)" rx="18"/>
  
  <!-- House structure -->
  <!-- Roof -->
  <polygon points="50,22 25,52 75,52" fill="white" opacity="0.95"/>
  
  <!-- Main body -->
  <rect x="25" y="52" width="50" height="32" fill="white" opacity="0.88" rx="2"/>
  
  <!-- Door -->
  <rect x="42" y="62" width="16" height="22" fill="#15803d" opacity="0.85" rx="1"/>
  
  <!-- Door handle -->
  <circle cx="56" cy="73" r="2" fill="#fbbf24" opacity="0.95"/>
  
  <!-- Windows left side -->
  <rect x="30" y="58" width="8" height="8" fill="#86efac" opacity="0.85" rx="1"/>
  <rect x="30" y="72" width="8" height="8" fill="#86efac" opacity="0.85" rx="1"/>
  
  <!-- Windows right side -->
  <rect x="62" y="58" width="8" height="8" fill="#86efac" opacity="0.85" rx="1"/>
  <rect x="62" y="72" width="8" height="8" fill="#86efac" opacity="0.85" rx="1"/>
  
  <!-- Accent - small leaf detail -->
  <path d="M 75 30 Q 78 28 80 32" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>